<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-labelledby="title desc">
  <title id="title">Ethereum.nix</title>
  <desc id="desc">Ethereum clients, tools and NixOS modules, packaged with Nix.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#141729"/>
      <stop offset="1" stop-color="#2a2e5c"/>
    </linearGradient>
    <radialGradient id="glow-eth" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8f9bff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#8f9bff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-nix" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7ebae4" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#7ebae4" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#ffffff" fill-opacity="0.07"/>
    </pattern>
    <g id="lambda">
      <path d="M -11 -20 L 12 22 M 1 1 L -12 22" fill="none" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </defs>

  <style>
    .float { animation: float 6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .spin { animation: spin 40s linear infinite; transform-box: fill-box; transform-origin: center; }
    .breathe { animation: breathe 6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .block { animation: lit 4.8s ease-in-out infinite; }
    .b2 { animation-delay: 0.8s; }
    .b3 { animation-delay: 1.6s; }
    .b4 { animation-delay: 2.4s; }
    .b5 { animation-delay: 3.2s; }
    .b6 { animation-delay: 4.0s; }
    .pulse { animation: travel 4.8s linear infinite; }
    .title { font: 700 64px "Inter", "Segoe UI", "Helvetica Neue", Arial, sans-serif; fill: #ffffff; letter-spacing: -1px; }
    .title .dot { fill: #7ebae4; }
    .tagline { font: 400 22px "Inter", "Segoe UI", "Helvetica Neue", Arial, sans-serif; fill: #c3c8f0; }
    @keyframes float { 0%, 100% { transform: translateY(-7px); } 50% { transform: translateY(7px); } }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes breathe { 0%, 100% { opacity: 0.6; transform: scale(0.92); } 50% { opacity: 1; transform: scale(1.08); } }
    @keyframes lit { 0%, 100% { fill-opacity: 0.08; stroke-opacity: 0.35; } 12% { fill-opacity: 0.55; stroke-opacity: 1; } 30% { fill-opacity: 0.08; stroke-opacity: 0.35; } }
    @keyframes travel { from { transform: translateX(0); opacity: 0; } 5% { opacity: 1; } 95% { opacity: 1; } to { transform: translateX(440px); opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .float, .spin, .breathe, .block, .pulse { animation: none; }
    }
  </style>

  <rect width="1200" height="320" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="24" fill="url(#dots)"/>

  <!-- Ethereum diamond -->
  <circle class="breathe" cx="170" cy="160" r="120" fill="url(#glow-eth)"/>
  <g transform="translate(170 158) scale(1.45)">
    <g class="float">
      <polygon points="0,-60 -38,4 0,-12" fill="#ffe94d"/>
      <polygon points="0,-12 -38,4 0,26" fill="#a7df7e"/>
      <polygon points="0,-60 38,4 0,-12" fill="#ff9c92"/>
      <polygon points="0,-12 38,4 0,26" fill="#d797d1"/>
      <polygon points="-38,14 0,38 0,64" fill="#53d3e0"/>
      <polygon points="38,14 0,38 0,64" fill="#5a9ded"/>
    </g>
  </g>

  <!-- Snowflake made of lambdas -->
  <circle class="breathe" cx="1030" cy="160" r="120" fill="url(#glow-nix)" style="animation-delay: 3s"/>
  <g transform="translate(1030 160) scale(1.15)">
    <g class="spin">
      <use href="#lambda" transform="rotate(0) translate(0 -46)" stroke="#7ebae4"/>
      <use href="#lambda" transform="rotate(60) translate(0 -46)" stroke="#5277c3"/>
      <use href="#lambda" transform="rotate(120) translate(0 -46)" stroke="#7ebae4"/>
      <use href="#lambda" transform="rotate(180) translate(0 -46)" stroke="#5277c3"/>
      <use href="#lambda" transform="rotate(240) translate(0 -46)" stroke="#7ebae4"/>
      <use href="#lambda" transform="rotate(300) translate(0 -46)" stroke="#5277c3"/>
    </g>
  </g>

  <!-- Title -->
  <text class="title" x="600" y="148" text-anchor="middle">Ethereum<tspan class="dot">.nix</tspan></text>
  <text class="tagline" x="600" y="192" text-anchor="middle">Ethereum clients, tools and NixOS modules, packaged with Nix</text>

  <!-- Chain of blocks -->
  <g transform="translate(380 250)">
    <line x1="0" y1="0" x2="440" y2="0" stroke="#5a62a8" stroke-width="2" stroke-dasharray="4 6"/>
    <g fill="#8f9bff" fill-opacity="0.2" stroke="#8f9bff" stroke-width="2">
      <rect class="block" x="-12" y="-12" width="24" height="24" rx="5"/>
      <rect class="block b2" x="76" y="-12" width="24" height="24" rx="5"/>
      <rect class="block b3" x="164" y="-12" width="24" height="24" rx="5"/>
      <rect class="block b4" x="252" y="-12" width="24" height="24" rx="5"/>
      <rect class="block b5" x="340" y="-12" width="24" height="24" rx="5"/>
      <rect class="block b6" x="428" y="-12" width="24" height="24" rx="5"/>
    </g>
    <circle class="pulse" cx="0" cy="0" r="5" fill="#7ebae4"/>
  </g>
</svg>
