name: Bot Commands

on:
  issue_comment:
    types: [created]

# Every API call and push uses the GitHub App token, not GITHUB_TOKEN.
permissions: {}

jobs:
  rebase:
    if: >-
      github.event.issue.pull_request
      && contains(github.event.comment.body, '/rebase')
    runs-on: ubuntu-latest
    steps:
      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: React with rocket to acknowledge
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          gh api \
            repos/${{ github.repository }}/issues/comments/${{ github.event.comment.id }}/reactions \
            -f content='rocket'

      - name: Check permissions
        id: check-perms
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          COMMENTER: ${{ github.event.comment.user.login }}
        run: |
          permission=$(gh api \
            "repos/${{ github.repository }}/collaborators/${COMMENTER}/permission" \
            --jq '.permission')

          if [[ "$permission" != "admin" && "$permission" != "write" ]]; then
            gh api \
              repos/${{ github.repository }}/issues/comments/${{ github.event.comment.id }}/reactions \
              -f content='-1'
            echo "User ${COMMENTER} has '$permission' permission, need write or admin"
            exit 1
          fi

      - name: Get PR details
        id: pr-details
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          pr_json=$(gh api repos/${{ github.repository }}/pulls/${{ github.event.issue.number }})

          head_ref=$(echo "$pr_json" | jq -r '.head.ref')
          base_ref=$(echo "$pr_json" | jq -r '.base.ref')
          head_repo_full_name=$(echo "$pr_json" | jq -r '.head.repo.full_name')

          echo "head_ref=$head_ref" >> "$GITHUB_OUTPUT"
          echo "base_ref=$base_ref" >> "$GITHUB_OUTPUT"
          echo "head_repo=$head_repo_full_name" >> "$GITHUB_OUTPUT"

          if [[ "$head_repo_full_name" != "${{ github.repository }}" ]]; then
            gh api \
              repos/${{ github.repository }}/issues/${{ github.event.issue.number }}/comments \
              -f body="Cannot rebase: this PR is from a fork (\`$head_repo_full_name\`). Please rebase locally."
            exit 1
          fi

      - name: Checkout PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.pr-details.outputs.head_ref }}
          fetch-depth: 0
          # Commits are recreated and the ref is moved through the API below.
          persist-credentials: false

      - name: Rebase onto base branch
        env:
          BASE_REF: ${{ steps.pr-details.outputs.base_ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin "$BASE_REF"
          git rebase "origin/$BASE_REF"

      - name: Push signed commits
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          HEAD_REF: ${{ steps.pr-details.outputs.head_ref }}
          BASE_REF: ${{ steps.pr-details.outputs.base_ref }}
        run: |
          head_ref="$HEAD_REF"
          base_ref="$BASE_REF"

          # Recreate each rebased commit via the GitHub API so they are signed
          commits=$(git rev-list --reverse "origin/${base_ref}..HEAD")
          prev_sha=$(git rev-parse "origin/${base_ref}")

          for sha in $commits; do
            tree=$(git rev-parse "${sha}^{tree}")
            message=$(git log -1 --format=%B "$sha")

            # Preserve original author and committer
            author_name=$(git log -1 --format='%an' "$sha")
            author_email=$(git log -1 --format='%ae' "$sha")
            author_date=$(git log -1 --format='%aI' "$sha")
            committer_name=$(git log -1 --format='%cn' "$sha")
            committer_email=$(git log -1 --format='%ce' "$sha")
            committer_date=$(git log -1 --format='%cI' "$sha")

            prev_sha=$(jq -n \
              --arg message "$message" \
              --arg tree "$tree" \
              --arg parent "$prev_sha" \
              --arg aname "$author_name" \
              --arg aemail "$author_email" \
              --arg adate "$author_date" \
              --arg cname "$committer_name" \
              --arg cemail "$committer_email" \
              --arg cdate "$committer_date" \
              '{message: $message, tree: $tree, parents: [$parent],
                author: {name: $aname, email: $aemail, date: $adate},
                committer: {name: $cname, email: $cemail, date: $cdate}}' \
            | gh api "repos/${{ github.repository }}/git/commits" --input - --jq '.sha')
          done

          # Force-update the branch ref to the new signed commits
          gh api "repos/${{ github.repository }}/git/refs/heads/${head_ref}" \
            -X PATCH \
            -f "sha=${prev_sha}" \
            -F "force=true"

      - name: React with success
        if: success()
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          gh api \
            repos/${{ github.repository }}/issues/comments/${{ github.event.comment.id }}/reactions \
            -f content='hooray'

      - name: React with failure
        if: failure()
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          gh api \
            repos/${{ github.repository }}/issues/comments/${{ github.event.comment.id }}/reactions \
            -f content='confused'
