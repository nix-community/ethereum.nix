name: Updater

on:
  workflow_call:
    inputs:
      update-type:
        description: "What to update: 'packages', 'inputs', or empty for both"
        required: false
        type: string
        default: ""
      packages:
        description: "Space-separated list of specific packages to update (empty for all)"
        required: false
        type: string
        default: ""
      inputs:
        description: "Space-separated list of specific inputs to update (empty for all)"
        required: false
        type: string
        default: ""
      pr-labels:
        description: "Comma-separated list of labels to add to PRs"
        required: false
        type: string
        default: "dependencies,automated"
    secrets:
      APP_ID:
        description: "GitHub App ID"
        required: true
      APP_PRIVATE_KEY:
        description: "GitHub App private key"
        required: true

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-slim
    outputs:
      matrix: ${{ steps.build-matrix.outputs.matrix }}
      has-updates: ${{ steps.build-matrix.outputs.has-updates }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ github.token }}
      - run: pip install pyyaml
      - name: Build update matrix
        id: build-matrix
        env:
          UPDATE_TYPE: ${{ inputs.update-type }}
          PACKAGES: ${{ inputs.packages }}
          INPUTS: ${{ inputs.inputs }}
        run: python3 .github/actions/discovery.py

  update:
    needs: discover
    if: needs.discover.outputs.has-updates == 'true'
    runs-on: ubuntu-slim
    concurrency:
      group: updater-${{ github.repository }}-${{ matrix.type }}-${{ matrix.name }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.discover.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ github.token }}
      - name: Keep orchestration from the workflow revision
        run: |
          cp -r .github/ci "$RUNNER_TEMP/ci"
          cp .github/config/update-policy.json "$RUNNER_TEMP/ci/update-policy.json"
          cp .github/actions/update.sh "$RUNNER_TEMP/update.sh"
      - name: Preserve update branch
        env:
          TYPE: ${{ matrix.type }}
          NAME: ${{ matrix.name }}
        run: python3 "$RUNNER_TEMP/ci/branches.py" prepare "$TYPE" "$NAME" "$RUNNER_TEMP/update-state.json"
      - name: Perform update
        id: update
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TYPE: ${{ matrix.type }}
          NAME: ${{ matrix.name }}
        run: |
          if [[ "$TYPE" = package ]]; then
            nix develop .#ci -c python3 "$RUNNER_TEMP/ci/update.py" "$NAME"
          else
            bash "$RUNNER_TEMP/update.sh" "$TYPE" "$NAME"
          fi
      - name: Generate publication token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
      - name: Publish signed update
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TYPE: ${{ matrix.type }}
          NAME: ${{ matrix.name }}
          CURRENT_VERSION: ${{ matrix.current_version }}
          NEW_VERSION: ${{ steps.update.outputs.new_version }}
          PR_LABELS: ${{ inputs.pr-labels }}
        run: python3 "$RUNNER_TEMP/ci/branches.py" publish "$TYPE" "$NAME" "$RUNNER_TEMP/update-state.json"

  update-readme:
    needs: [discover, update]
    runs-on: ubuntu-slim
    if: always() && needs.discover.outputs.has-updates == 'true'
    concurrency:
      group: updater-${{ github.repository }}-readme
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: cachix/install-nix-action@v31
      - name: Preserve README branch
        run: |
          cp -r .github/ci "$RUNNER_TEMP/ci"
          cp .github/config/update-policy.json "$RUNNER_TEMP/ci/update-policy.json"
          python3 "$RUNNER_TEMP/ci/branches.py" prepare readme readme "$RUNNER_TEMP/update-state.json"
      - name: Regenerate README
        run: ./scripts/generate-package-docs.py
      - name: Generate publication token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
      - name: Publish signed README update
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_LABELS: documentation,automated
        run: python3 "$RUNNER_TEMP/ci/branches.py" publish readme readme "$RUNNER_TEMP/update-state.json"

  summary:
    needs: [discover, update, update-readme]
    runs-on: ubuntu-slim
    if: always()
    steps:
      - name: Summarize job results
        env:
          DISCOVERY: ${{ needs.discover.result }}
          UPDATES: ${{ needs.update.result }}
          README: ${{ needs.update-readme.result }}
        run: |
          {
            echo "## Update results"
            echo "Discovery: $DISCOVERY"
            echo "Packages and inputs: $UPDATES"
            echo "README: $README"
          } >> "$GITHUB_STEP_SUMMARY"
