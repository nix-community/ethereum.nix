name: Automation tests
on:
  pull_request:
  merge_group:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    name: automation-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install updater sandbox
        run: bash .github/ci/setup-sandbox.sh
      - run: python3 -m unittest discover -s .github/ci/tests -v
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          REQUIRE_UPDATER_SANDBOX: "1"
          BWRAP: /usr/local/bin/ethereum-updater-bwrap
